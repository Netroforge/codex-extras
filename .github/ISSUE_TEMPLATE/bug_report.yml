name: Bug report
description: Report a reproducible problem with Codex Extras.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove sensitive information before submitting.

  - type: input
    id: vscode-version
    attributes:
      label: Visual Studio Code version
      placeholder: "1.XX.X"
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Official Codex extension version
      description: Find this in the Extensions view under Codex – OpenAI's coding agent.
      placeholder: "Version number"
    validations:
      required: true

  - type: input
    id: extras-version
    attributes:
      label: Codex Extras version
      placeholder: "1.0.1"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that reliably reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots or non-sensitive logs if they help explain the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I verified that the official Codex extension is installed and enabled.
          required: true
