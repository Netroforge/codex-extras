name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension
        run: npm test

      - name: Package VSIX
        run: npm run package -- --out codex-extras.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: codex-extras-vsix
          path: codex-extras.vsix
          if-no-files-found: error
          retention-days: 14
