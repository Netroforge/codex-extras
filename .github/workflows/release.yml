name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish extension
    if: github.repository == 'netroforge/codex-extras'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension
        run: npm test

      - name: Validate release tag
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"

      - name: Package VSIX
        run: npm run package -- --out "codex-extras-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath "codex-extras-${GITHUB_REF_NAME#v}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" "codex-extras-${GITHUB_REF_NAME#v}.vsix" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
